[package]
name = "traffic-studio"
version = "0.1.0"
description = "Traffic Studio desktop shell"
authors = ["Traffic Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# P03 local persistence/DTOs/content checksums. MIT / Apache-2.0 compatible.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "http2", "multipart", "stream", "cookies"] }
tokio = { version = "1", features = ["sync", "macros", "time", "fs", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
rcgen = "0.14"
time = { version = "0.3", features = ["formatting", "parsing"] }
digest_auth = "0.3"
# Isolated API scripts, without native/module/OS bindings (MIT).
rquickjs = { version = "0.14", default-features = false }
tempfile = "3"
# Real WS/SSE streaming transport and bounded asynchronous message handling (MIT).
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
futures-util = { version = "0.3", features = ["sink"] }
# Bounded original-byte body decoding, without implicit HTTP decompression.
flate2 = "1"
brotli = "8"
# Safe, bounded Charles XML session exchange parser; no DTD/entity resolution (MIT).
quick-xml = "0.42"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_Security_Cryptography", "Win32_Networking_WinInet"] }
